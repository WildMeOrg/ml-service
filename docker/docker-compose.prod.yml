version: '3.8'

services:
  ml-service:
    build:
      context: ..
      dockerfile: docker/dockerfile
    container_name: detector_inference
    ports:
      - "${ML_SERVICE_PORT:-6050}:6050"
    volumes:
      - "${MODELS_DIR:?Set MODELS_DIR in .env}:/datasets:ro"
      - "${MODELS_DIR}:/models:ro"
      - "${MODELS_DIR}:/ml-service_models:ro"
      - "${MODEL_CONFIG:?Set MODEL_CONFIG in .env}:/app/app/model_config.json:ro"
      - "${DATA_DB_DIR:?Set DATA_DB_DIR in .env}:/data/db:ro"
      - ultralytics_config:/root/.config/Ultralytics
    environment:
      - PYTHONPATH=/app
      # Image-fetch resilience. Each falls back to the in-code default when
      # the variable is unset in .env, so leaving .env untouched preserves
      # current behaviour.
      - IMAGE_FETCH_CONNECT_TIMEOUT_S=${IMAGE_FETCH_CONNECT_TIMEOUT_S:-10}
      - IMAGE_FETCH_READ_TIMEOUT_S=${IMAGE_FETCH_READ_TIMEOUT_S:-30}
      - IMAGE_FETCH_TOTAL_DEADLINE_S=${IMAGE_FETCH_TOTAL_DEADLINE_S:-60}
      - IMAGE_FETCH_MAX_BYTES=${IMAGE_FETCH_MAX_BYTES:-52428800}
      - IMAGE_ADMISSION_LIMIT=${IMAGE_ADMISSION_LIMIT:-8}
      - IMAGE_ADMISSION_WAIT_S=${IMAGE_ADMISSION_WAIT_S:-20}
      - IMAGE_MAX_PIXELS=${IMAGE_MAX_PIXELS:-150000000}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-4194304}
      # PairX fallback when a caller omits model_id. Must name a MiewID
      # model this instance loads -- registries differ between instances.
      - EXPLAIN_DEFAULT_MODEL_ID=${EXPLAIN_DEFAULT_MODEL_ID:-miewid-msv4.1}
      # cv2 decode backstop, read by OpenCV itself rather than app code.
      # Uncomment to override cv2's ~1GP default:
      # - OPENCV_IO_MAX_IMAGE_PIXELS=${OPENCV_IO_MAX_IMAGE_PIXELS:-1073741824}
    # Data-URI installs: MAX_REQUEST_BODY_BYTES must cover base64 inflation
    #   (~4/3x: a 50MB image needs ~67MB body cap).
    # Raise MAX_REQUEST_BODY_BYTES only for installations POSTing data URIs.
    # Recommended nginx back-stop in front of this service: client_max_body_size.
    # --limit-concurrency 32 (in-code default) 503s excess connections per worker.
    # One worker per GPU: extra workers each load a full copy of all models
    # into the same GPU's VRAM (OOM risk). For more throughput, add a separately
    # named service with distinct GPU_ID, container name, and host port rather
    # than raising WORKERS.
    command: python3 -m app.main --host 0.0.0.0 --port 6050 --device ${DEVICE:-cuda} --workers ${WORKERS:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_ID:-0}']
              capabilities: [gpu]
          memory: '32G'
    shm_size: '16G'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6050/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    labels:
      - autoheal=true
    networks:
      - shared_net

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: detector_inference_autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=90
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  shared_net:
    external: true

volumes:
  ultralytics_config:
